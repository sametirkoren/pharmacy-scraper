services:
  - type: cron
    name: pharmacy-scraper
    runtime: python
    schedule: "0 5 * * *"  # Her gün 05:00 UTC (08:00 TR)
    buildCommand: pip install -r requirements.txt
    startCommand: python eczane_scraper_requests.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
